name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    uses: eeekcct/goreleaser-rust-workflow/.github/workflows/release.yml@62a698c0db2340ca7f608a1d729a1b49a2aa8e2f # v0.2.2
    with:
      third_party_licenses: true
      license_check: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
