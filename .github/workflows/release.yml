name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    uses: eeekcct/goreleaser-rust-workflow/.github/workflows/release.yml@87cc8c2d4fb750da7bc51a70793be1b88087f7ea
    with:
      third_party_licenses: true
      license_check: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
